# Weekly update PRs for CI actions, the app, its base image and the docs site.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      remix: { patterns: ['remix', '@remix-run/*'] }
  - package-ecosystem: npm
    directory: /docs/site
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      docs-site: { patterns: ['*'] }
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: build }
