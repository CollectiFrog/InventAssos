# Checks every pull request with the same Makefile targets contributors run locally.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventassos
          POSTGRES_PASSWORD: inventassos
          POSTGRES_DB: inventassos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inventassos -d inventassos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://inventassos:inventassos@localhost:5432/inventassos_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventassos
          POSTGRES_PASSWORD: inventassos
          POSTGRES_DB: inventassos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inventassos -d inventassos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://inventassos:inventassos@localhost:5432/inventassos_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium and its system libraries; `make a11y` then finds the browser in place (ADR 0024).
      - run: npx playwright install --with-deps chromium
      - run: make a11y

  image:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Same Dockerfile as release.yml, built but not pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: make docs
